<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set New AIATS Password</title>

    <meta
        name="description"
        content="Create a new password for your AIATS client account."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Inter", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(44, 75, 120, 0.24),
                    transparent 35%
                ),
                #07111f;

            color: #ffffff;
            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 620px;

            margin: 0 auto;
            padding: 42px 0;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 12px;
            margin-bottom: 42px;

            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
        }

        .card {
            background: rgba(10, 24, 40, 0.92);

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;

            padding: 42px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.3);
        }

        .eyebrow {
            color: #8fa9c5;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 10px;

            font-size: 34px;
            line-height: 1.15;

            letter-spacing: -0.035em;
        }

        .intro {
            margin: 0 0 30px;

            color: #8fa0b2;

            line-height: 1.65;
            font-size: 14px;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #c7d2df;

            font-size: 12px;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 48px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;

            background: rgba(255,255,255,0.045);

            color: #ffffff;

            padding: 0 14px;

            font: inherit;

            outline: none;
        }

        .password-wrapper input {
            padding-right: 78px;
        }

        input::placeholder {
            color: #617287;
        }

        input:focus {
            border-color: rgba(255,255,255,0.35);

            background: rgba(255,255,255,0.055);
        }

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            width: auto;
            height: auto;

            margin: 0;
            padding: 0;

            border: 0;

            background: transparent !important;

            color: #8fa9c5;

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .password-note {
            margin-top: 7px;

            color: #617287;

            font-size: 11px;
        }

        .password-status {
            display: none;

            margin-top: 7px;

            font-size: 11px;
        }

        .password-status.valid {
            display: block;
            color: #9fc9aa;
        }

        .password-status.invalid {
            display: block;
            color: #d69b9b;
        }

        .requirements {
            margin: 8px 0 22px;
            padding: 0;

            list-style: none;

            color: #617287;

            font-size: 11px;
            line-height: 1.8;
        }

        .requirements li::before {
            content: "•";
            margin-right: 7px;
        }

        button.submit-button {
            width: 100%;
            height: 50px;

            margin-top: 8px;

            border: 0;
            border-radius: 10px;

            background: #ffffff;
            color: #07111f;

            font: inherit;
            font-weight: 700;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        button.submit-button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        button.submit-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin: 20px 0 0;

            padding: 13px 14px;

            border-radius: 10px;

            font-size: 12px;
            line-height: 1.55;
        }

        .message.error {
            display: block;

            color: #efb0b0;

            background: rgba(150,45,45,0.12);

            border: 1px solid rgba(200,90,90,0.18);
        }

        .message.success {
            display: block;

            color: #b4d9bd;

            background: rgba(45,120,70,0.12);

            border: 1px solid rgba(90,170,110,0.18);
        }

        .login-link {
            margin-top: 24px;

            text-align: center;

            color: #718399;

            font-size: 12px;
        }

        .login-link a {
            color: #ffffff;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back {
            margin-top: 24px;

            text-align: center;
        }

        .back a {
            color: #607186;

            font-size: 11px;

            text-decoration: none;
        }

        .back a:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .page {
                padding: 22px 0;
            }

            .card {
                padding: 28px 22px;
                border-radius: 17px;
            }

            h1 {
                font-size: 29px;
            }

        }

    </style>

</head>


<body>

<main class="page">


    <div class="brand">

        <div class="brand-mark">
            A
        </div>

        <span>
            AIATS
        </span>

    </div>


    <section class="card">


        <div class="eyebrow">
            Account Recovery
        </div>


        <h1>
            Create a new password
        </h1>


        <p class="intro">
            Choose a new password for your AIATS client
            account. Your password must contain at least
            8 characters.
        </p>


        <form id="resetForm">


            <div class="field">

                <label for="password">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="toggle-password"
                    >
                        Show
                    </button>

                </div>

                <div
                    id="passwordStatus"
                    class="password-status"
                ></div>

            </div>


            <ul class="requirements">

                <li>
                    Minimum 8 characters
                </li>

                <li>
                    Both passwords must match
                </li>

            </ul>


            <button
                id="resetButton"
                class="submit-button"
                type="submit"
            >
                Update Password
            </button>


        </form>


        <div
            id="message"
            class="message"
            role="alert"
        ></div>


        <div class="login-link">

            Remember your password?

            <a href="login.html">
                Sign in
            </a>

        </div>


        <div class="back">

            <a href="index.html">
                ← Back to AIATS Portal
            </a>

        </div>


    </section>


</main>


<script type="module">

    import { supabase }
        from "./js/supabase-config.js";


    const form =
        document.getElementById("resetForm");


    const button =
        document.getElementById("resetButton");


    const message =
        document.getElementById("message");


    const password =
        document.getElementById("password");


    const confirmPassword =
        document.getElementById("confirmPassword");


    const passwordStatus =
        document.getElementById("passwordStatus");


    const togglePassword =
        document.getElementById("togglePassword");


    const toggleConfirmPassword =
        document.getElementById("toggleConfirmPassword");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    function toggleField(
        input,
        button
    ) {

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "Hide";

        } else {

            input.type = "password";

            button.textContent = "Show";

        }

    }


    togglePassword.addEventListener(
        "click",
        () => {

            toggleField(
                password,
                togglePassword
            );

        }
    );


    toggleConfirmPassword.addEventListener(
        "click",
        () => {

            toggleField(
                confirmPassword,
                toggleConfirmPassword
            );

        }
    );


    function checkPasswords() {

        if (!confirmPassword.value) {

            passwordStatus.textContent = "";

            passwordStatus.className =
                "password-status";

            return false;
        }


        if (
            password.value ===
            confirmPassword.value
        ) {

            passwordStatus.textContent =
                "Passwords match.";

            passwordStatus.className =
                "password-status valid";

            return true;

        }


        passwordStatus.textContent =
            "Passwords do not match.";

        passwordStatus.className =
            "password-status invalid";

        return false;

    }


    password.addEventListener(
        "input",
        checkPasswords
    );


    confirmPassword.addEventListener(
        "input",
        checkPasswords
    );


    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            message.textContent = "";

            message.className =
                "message";


            if (password.value.length < 8) {

                showMessage(
                    "Your password must contain at least 8 characters.",
                    "error"
                );

                return;

            }


            if (
                password.value !==
                confirmPassword.value
            ) {

                showMessage(
                    "The passwords do not match.",
                    "error"
                );

                return;

            }


            button.disabled = true;

            button.textContent =
                "Updating Password...";


            try {

                const {
                    error
                } = await supabase.auth.updateUser({
                    password: password.value
                });


                if (error) {
                    throw error;
                }


                showMessage(
                    "Your password has been updated successfully. You can now sign in with your new password.",
                    "success"
                );


                form.reset();


                passwordStatus.textContent = "";

                passwordStatus.className =
                    "password-status";


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 2500);


            } catch (error) {

                console.error(
                    "Password update error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to update your password. Please request a new reset link.",
                    "error"
                );


                button.disabled = false;

                button.textContent =
                    "Update Password";

            }

        }
    );


</script>


</body>

</html>
