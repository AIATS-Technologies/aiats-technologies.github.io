<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIATS Login</title>
 <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(44, 75, 120, 0.25), transparent 35%),
                radial-gradient(circle at 85% 90%, rgba(20, 50, 80, 0.22), transparent 35%),
                #07111f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .portal {
            width: 100%;
            max-width: 1050px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            background: rgba(12, 25, 42, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        }

        .intro {
            padding: 64px;
            background:
                linear-gradient(
                    135deg,
                    rgba(19, 40, 66, 0.95),
                    rgba(7, 17, 31, 0.95)
                );
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.08em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 15px;
        }

        .eyebrow {
            margin-top: 70px;
            color: #8fa9c5;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0 20px;
            font-size: clamp(38px, 5vw, 64px);
            line-height: 1.02;
            letter-spacing: -0.04em;
        }

        .intro p {
            max-width: 560px;
            color: #aebdce;
            font-size: 16px;
            line-height: 1.75;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 40px;
        }

        .feature {
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.025);
            border-radius: 12px;
            color: #dce5ef;
            font-size: 13px;
        }

        .login-panel {
            padding: 56px 46px;
            background: rgba(5, 14, 25, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-panel h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .login-panel > p {
            margin: 0 0 30px;
            color: #8495a8;
            font-size: 14px;
            line-height: 1.6;
        }

        .status {
            margin-bottom: 24px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            color: #aebdce;
            font-size: 12px;
        }

        .status.success {
            color: #a9d8b5;
        }

        .status.error {
            color: #e8a7a7;
        }

        .actions {
            display: grid;
            gap: 12px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 11px;
            padding: 14px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary {
            background: #ffffff;
            color: #07111f;
        }

        .secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.13);
            color: #ffffff;
        }

        .footer {
            margin-top: 32px;
            color: #607186;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 780px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .portal {
                grid-template-columns: 1fr;
                border-radius: 18px;
            }

            .intro {
                padding: 38px 26px;
            }

            .eyebrow {
                margin-top: 42px;
            }

            .features {
                grid-template-columns: 1fr;
                margin-top: 28px;
            }

            .login-panel {
                padding: 36px 26px 42px;
            }

            h1 {
                font-size: 42px;
            }
        }
    </style></head>
<body><div class="card">
<h2>AIATS Client Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<div style="position:relative">
<input id="password" type="password" placeholder="Password" required>
<button type="button" id="toggle" style="position:absolute;right:4px;top:10px;width:auto;padding:4px 8px">👁</button>
</div>
<div class="row">
<label><input type="checkbox" id="remember" style="width:auto"> Remember me</label>
<a href="forgot-password.html">Forgot password?</a>
</div>
<button id="loginButton">Sign In</button>
</form>
<p><a href="register.html">Create account</a></p>
<div id="msg"></div>
</div>
<script type="module">
import { supabase } from "./js/supabase-config.js";
const pw=document.getElementById("password");
toggle.onclick=()=>{pw.type=pw.type==="password"?"text":"password";toggle.textContent=pw.type==="password"?"👁":"🙈";}
const {data:{session}}=await supabase.auth.getSession();
if(session) location.href="dashboard.html";
loginForm.onsubmit=async(e)=>{
e.preventDefault();
loginButton.disabled=true;loginButton.textContent="Signing In...";
msg.textContent="";
const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:pw.value});
if(error){msg.textContent=error.message.includes("Invalid")?"Incorrect email or password.":error.message;loginButton.disabled=false;loginButton.textContent="Sign In";return;}
location.href="dashboard.html";
};
</script></body></html>
