<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIATS Login</title>
<style>
body{font-family:Arial;background:#07111f;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#0d1b2a;padding:30px;border-radius:12px;width:360px}
input{width:100%;padding:10px;margin:8px 0;background:#16283d;border:1px solid #345;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
button{width:100%;padding:12px;margin-top:15px}
a{color:#9ecbff;text-decoration:none}
</style></head>
<body><div class="card">
<h2>AIATS Client Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<div style="position:relative">
<input id="password" type="password" placeholder="Password" required>
<button type="button" id="toggle" style="position:absolute;right:4px;top:10px;width:auto;padding:4px 8px">👁</button>
</div>
<div class="row">
<label><input type="checkbox" id="remember" style="width:auto"> Remember me</label>
<a href="forgot-password.html">Forgot password?</a>
</div>
<button id="loginButton">Sign In</button>
</form>
<p><a href="register.html">Create account</a></p>
<div id="msg"></div>
</div>
<script type="module">
import { supabase } from "./js/supabase-config.js";
const pw=document.getElementById("password");
toggle.onclick=()=>{pw.type=pw.type==="password"?"text":"password";toggle.textContent=pw.type==="password"?"👁":"🙈";}
const {data:{session}}=await supabase.auth.getSession();
if(session) location.href="dashboard.html";
loginForm.onsubmit=async(e)=>{
e.preventDefault();
loginButton.disabled=true;loginButton.textContent="Signing In...";
msg.textContent="";
const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:pw.value});
if(error){msg.textContent=error.message.includes("Invalid")?"Incorrect email or password.":error.message;loginButton.disabled=false;loginButton.textContent="Sign In";return;}
location.href="dashboard.html";
};
</script></body></html>
