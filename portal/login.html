<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIATS Client Login</title>

<meta
    name="description"
    content="Login to your AIATS client portal."
>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet"
>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;
    min-height:100vh;

    font-family:"Inter",Arial,sans-serif;

    background:
    radial-gradient(
        circle at 20% 10%,
        rgba(44,75,120,.24),
        transparent 35%
    ),
    #07111f;

    color:white;

    padding:24px;
}


.page {

    width:100%;
    max-width:620px;

    margin:auto;

    padding:42px 0;

}


.brand {

    display:flex;
    align-items:center;

    gap:12px;

    margin-bottom:42px;

    font-weight:700;

    letter-spacing:.08em;

}


.brand-mark {

    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border:
    1px solid rgba(255,255,255,.25);

    border-radius:10px;

}


.card {

    background:
    rgba(10,24,40,.92);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:22px;

    padding:42px;

    box-shadow:
    0 30px 80px rgba(0,0,0,.3);

}


.eyebrow {

    color:#8fa9c5;

    font-size:11px;

    font-weight:600;

    letter-spacing:.15em;

    text-transform:uppercase;

}


h1 {

    margin:12px 0 10px;

    font-size:34px;

    letter-spacing:-.035em;

}


.intro {

    margin:0 0 30px;

    color:#8fa0b2;

    line-height:1.65;

    font-size:14px;

}



.field {

    margin-bottom:20px;

}


label {

    display:block;

    margin-bottom:8px;

    color:#c7d2df;

    font-size:12px;

    font-weight:600;

}


input {

    width:100%;

    height:48px;

    border:
    1px solid rgba(255,255,255,.12);

    border-radius:10px;

    background:
    rgba(255,255,255,.045);

    color:white;

    padding:0 14px;

    font:inherit;

    outline:none;

}


input:focus {

    border-color:
    rgba(255,255,255,.35);

}



button {

    width:100%;

    height:50px;

    margin-top:10px;

    border:0;

    border-radius:10px;

    background:white;

    color:#07111f;

    font:inherit;

    font-weight:700;

    cursor:pointer;

}


button:disabled {

    opacity:.55;

    cursor:not-allowed;

}



.message {

    display:none;

    margin-top:20px;

    padding:13px;

    border-radius:10px;

    font-size:12px;

    line-height:1.5;

}


.message.error {

    display:block;

    color:#efb0b0;

    background:
    rgba(150,45,45,.12);

    border:
    1px solid rgba(200,90,90,.18);

}



.message.success {

    display:block;

    color:#b4d9bd;

    background:
    rgba(45,120,70,.12);

    border:
    1px solid rgba(90,170,110,.18);

}



.links {

    margin-top:25px;

    text-align:center;

    color:#718399;

    font-size:12px;

}


.links a {

    color:white;

    text-decoration:none;

}



.back {

    margin-top:25px;

    text-align:center;

}


.back a {

    color:#607186;

    font-size:11px;

    text-decoration:none;

}



@media(max-width:600px){

    body {

        padding:12px;

    }


    .card {

        padding:28px 22px;

        border-radius:17px;

    }


    h1 {

        font-size:29px;

    }

}


</style>


</head>


<body>


<main class="page">


<div class="brand">

    <div class="brand-mark">
        A
    </div>

    <span>
        AIATS
    </span>

</div>



<section class="card">


<div class="eyebrow">
    Client Portal
</div>


<h1>
    Sign in
</h1>


<p class="intro">

Access your AIATS account and manage
your portfolio requests.

</p>



<form id="loginForm">


<div class="field">

<label for="email">
Email Address
</label>


<input

id="email"

type="email"

autocomplete="email"

required

>

</div>



<div class="field">

<label for="password">
Password
</label>


<input

id="password"

type="password"

autocomplete="current-password"

required

>

</div>



<button
id="loginButton"
type="submit"
>

Sign In

</button>


</form>



<div
id="message"
class="message"
></div>



<div class="links">

Don't have an account?

<a href="register.html">
Create account
</a>

</div>



<div class="back">

<a href="index.html">
← Back to AIATS Portal
</a>

</div>



</section>


</main>



<script type="module">


import { supabase }

from "./js/supabase-config.js";



const form =
document.getElementById("loginForm");


const button =
document.getElementById("loginButton");


const message =
document.getElementById("message");



function showMessage(text,type){

    message.textContent=text;

    message.className=
    "message "+type;

}



form.addEventListener(
"submit",

async(event)=>{


event.preventDefault();



button.disabled=true;

button.textContent=
"Signing in...";

message.className=
"message";

message.textContent="";



const email =
document.getElementById("email")
.value
.trim();



const password =
document.getElementById("password")
.value;



try{


const {

data,

error

}

=
await supabase.auth.signInWithPassword({

email,

password

});



if(error){

    throw error;

}



if(data.user){


showMessage(

"Login successful. Redirecting...",

"success"

);



setTimeout(()=>{


window.location.href=
"dashboard.html";


},1000);



}



}

catch(error){


console.error(
"Login error:",
error
);



showMessage(

error.message ||
"Unable to login.",

"error"

);


}

finally{


button.disabled=false;

button.textContent=
"Sign In";


}



});


</script>


</body>

</html>
