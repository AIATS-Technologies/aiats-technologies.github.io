<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIATS Login</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", Arial, sans-serif;
        background:
            radial-gradient(
                circle at 20% 10%,
                rgba(44, 75, 120, 0.24),
                transparent 35%
            ),
            #07111f;
        color: #ffffff;
        padding: 24px;
    }

    .page {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding: 42px 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 42px;
        font-weight: 700;
        letter-spacing: 0.08em;
    }

    .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 10px;
    }

    .card {
        background: rgba(10, 24, 40, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        padding: 42px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    }

    .eyebrow {
        color: #8fa9c5;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
    }

    h1 {
        margin: 12px 0 10px;
        font-size: 34px;
        letter-spacing: -0.035em;
    }

    .intro {
        margin: 0 0 30px;
        color: #8fa0b2;
        line-height: 1.65;
        font-size: 14px;
    }

    .field {
        margin-bottom: 19px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #c7d2df;
        font-size: 12px;
        font-weight: 600;
    }

    input,
    select {
        width: 100%;
        height: 48px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        background: rgba(255,255,255,0.045);
        color: #ffffff;
        padding: 0 14px;
        font: inherit;
        outline: none;
    }

    select option {
        background: #0b1a2b;
        color: #ffffff;
    }

    input:focus,
    select:focus {
        border-color: rgba(255,255,255,0.35);
    }

    .password-note {
        margin-top: 7px;
        color: #617287;
        font-size: 11px;
    }

    button {
        width: 100%;
        height: 50px;
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: #ffffff;
        color: #07111f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin: 20px 0 0;
        padding: 13px 14px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.55;
    }

    .message.error {
        display: block;
        color: #efb0b0;
        background: rgba(150, 45, 45, 0.12);
        border: 1px solid rgba(200, 90, 90, 0.18);
    }

    .message.success {
        display: block;
        color: #b4d9bd;
        background: rgba(45, 120, 70, 0.12);
        border: 1px solid rgba(90, 170, 110, 0.18);
    }

    .login-link {
        margin-top: 24px;
        text-align: center;
        color: #718399;
        font-size: 12px;
    }

    .login-link a {
        color: #ffffff;
        text-decoration: none;
    }

    .back {
        margin-top: 24px;
        text-align: center;
    }

    .back a {
        color: #607186;
        font-size: 11px;
        text-decoration: none;
    }
	.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 85px;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    height: auto;
    margin: 0;
    padding: 5px 10px;
    border: 0;
    background: transparent;
    color: #9fb0c5;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.toggle-password:hover {
    color: #ffffff;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 18px 0;
    font-size: 12px;
}

.row label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
}

.row a {
    color: #9fb0c5;
    text-decoration: none;
}

.row a:hover {
    color: #ffffff;
}

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        .page {
            padding: 22px 0;
        }

        .card {
            padding: 28px 22px;
            border-radius: 17px;
        }

        h1 {
            font-size: 29px;
        }
    }
</style>

</head>
<main class="page">

    <div class="brand">
        <div class="brand-mark">A</div>
        <span>AIATS</span>
    </div>

    <section class="card">
<h2>AIATS Client Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<div class="field">

    <label for="password">
        Password
    </label>

    <div class="password-wrapper">

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            id="togglePassword"
            class="toggle-password"
        >
            Show
        </button>

    </div>

</div>
<div class="row">
<label><input type="checkbox" id="remember" style="width:auto"> Remember me</label>
<a href="forgot-password.html">Forgot password?</a>
</div>
<button id="loginButton">Sign In</button>
</form>
<p><a href="register.html">Create account</a></p>
<div id="msg"></div>
</div>
<script type="module">
import { supabase } from "./js/supabase-config.js";
const pw=document.getElementById("password");
toggle.onclick = () => {
    if (pw.type === "password") {
        pw.type = "text";
        toggle.textContent = "Hide";
    } else {
        pw.type = "password";
        toggle.textContent = "Show";
    }
};
const {data:{session}}=await supabase.auth.getSession();
if(session) location.href="dashboard.html";
loginForm.onsubmit=async(e)=>{
e.preventDefault();
loginButton.disabled=true;loginButton.textContent="Signing In...";
msg.textContent="";
const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:pw.value});
if(error){msg.textContent=error.message.includes("Invalid")?"Incorrect email or password.":error.message;loginButton.disabled=false;loginButton.textContent="Sign In";return;}
location.href="dashboard.html";
};
</script>
    </section>

</main></body></html>
