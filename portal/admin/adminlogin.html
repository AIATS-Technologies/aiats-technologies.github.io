<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AIATS Admin Login</title>

<meta
    name="description"
    content="AIATS administration portal login."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: "Inter", Arial, sans-serif;

        background:
            radial-gradient(
                circle at 20% 10%,
                rgba(44, 75, 120, 0.24),
                transparent 35%
            ),
            #07111f;

        color: #ffffff;
        padding: 24px;
    }

    .page {
        width: 100%;
        max-width: 620px;

        margin: 0 auto;
        padding: 42px 0;
    }

    .brand {
        display: flex;
        align-items: center;

        gap: 12px;
        margin-bottom: 42px;

        font-weight: 700;
        letter-spacing: 0.08em;
    }

    .brand-mark {
        width: 38px;
        height: 38px;

        display: grid;
        place-items: center;

        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 10px;
    }

    .card {
        background: rgba(10, 24, 40, 0.92);

        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;

        padding: 42px;

        box-shadow:
            0 30px 80px rgba(0,0,0,0.3);
    }

    .eyebrow {
        color: #8fa9c5;

        font-size: 11px;
        font-weight: 600;

        letter-spacing: 0.15em;
        text-transform: uppercase;
    }

    h1 {
        margin: 12px 0 10px;

        font-size: 34px;
        line-height: 1.15;

        letter-spacing: -0.035em;
    }

    .intro {
        margin: 0 0 30px;

        color: #8fa0b2;

        line-height: 1.65;
        font-size: 14px;
    }

    .field {
        margin-bottom: 19px;
    }

    label {
        display: block;

        margin-bottom: 8px;

        color: #c7d2df;

        font-size: 12px;
        font-weight: 600;
    }

    input {
        width: 100%;
        height: 48px;

        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;

        background: rgba(255,255,255,0.045);

        color: #ffffff;

        padding: 0 14px;

        font: inherit;
        outline: none;
    }

    input::placeholder {
        color: #617287;
    }

    input:focus {
        border-color: rgba(255,255,255,0.35);

        background: rgba(255,255,255,0.055);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 78px;
    }

    .toggle-password {
        position: absolute;

        right: 12px;
        top: 50%;

        transform: translateY(-50%);

        width: auto;
        height: auto;

        margin: 0;
        padding: 0;

        border: 0;

        background: transparent !important;

        color: #8fa9c5;

        font-family: inherit;
        font-size: 12px;
        font-weight: 600;

        cursor: pointer;
    }

    .toggle-password:hover {
        color: #ffffff;
    }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin: 18px 0;

        font-size: 12px;
    }

    .row label {
        display: flex;
        align-items: center;

        gap: 7px;

        margin: 0;

        color: #718399;
        font-weight: 400;
    }

    .row input[type="checkbox"] {
        width: 14px;
        height: 14px;

        margin: 0;

        accent-color: #ffffff;
    }

    .row a {
        color: #9fb0c5;
        text-decoration: none;
    }

    .row a:hover {
        color: #ffffff;
    }

    .login-button {
        width: 100%;
        height: 50px;

        margin-top: 8px;

        border: 0;
        border-radius: 10px;

        background: #ffffff;
        color: #07111f;

        font: inherit;
        font-weight: 700;

        cursor: pointer;

        transition:
            opacity 0.2s ease,
            transform 0.2s ease;
    }

    .login-button:hover:not(:disabled) {
        transform: translateY(-1px);
    }

    .login-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    .message {
        display: none;

        margin: 20px 0 0;

        padding: 13px 14px;

        border-radius: 10px;

        font-size: 12px;
        line-height: 1.55;
    }

    .message.error {
        display: block;

        color: #efb0b0;

        background: rgba(150,45,45,0.12);

        border: 1px solid rgba(200,90,90,0.18);
    }

    .message.success {
        display: block;

        color: #b4d9bd;

        background: rgba(45,120,70,0.12);

        border: 1px solid rgba(90,170,110,0.18);
    }

    .portal-link {
        margin-top: 24px;

        text-align: center;

        color: #718399;

        font-size: 12px;
    }

    .portal-link a {
        color: #ffffff;
        text-decoration: none;
    }

    .back {
        margin-top: 24px;
        text-align: center;
    }

    .back a {
        color: #607186;

        font-size: 11px;
        text-decoration: none;
    }

    .back a:hover {
        color: #ffffff;
    }

    @media (max-width: 600px) {

        body {
            padding: 12px;
        }

        .page {
            padding: 22px 0;
        }

        .card {
            padding: 28px 22px;
            border-radius: 17px;
        }

        h1 {
            font-size: 29px;
        }

    }

</style>

</head>

<body>

<main class="page">


<div class="brand">

    <div class="brand-mark">
        A
    </div>

    <span>
        AIATS
    </span>

</div>


<section class="card">


    <div class="eyebrow">
        Administration Portal
    </div>


    <h1>
        Admin Sign In
    </h1>


    <p class="intro">
        Sign in to access the AIATS administration
        dashboard and manage client portfolio requests.
    </p>


    <form id="adminLoginForm">


        <div class="field">

            <label for="email">
                Administrator Email
            </label>

            <input
                id="email"
                type="email"
                autocomplete="username"
                placeholder="Administrator email"
                required
            >

        </div>


        <div class="field">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="row">

            <label>

                <input
                    type="checkbox"
                    id="remember"
                >

                Remember me

            </label>


            <a href="forgot-password.html">
                Forgot password?
            </a>

        </div>


        <button
            id="loginButton"
            class="login-button"
            type="submit"
        >
            Sign In
        </button>


    </form>


    <div
        id="message"
        class="message"
        role="alert"
    ></div>


    <div class="portal-link">

        Client portal?

        <a href="login.html">
            Client Sign In
        </a>

    </div>


    <div class="back">

        <a href="index.html">
            ← Back to AIATS Portal
        </a>

    </div>


</section>


</main>

<script type="module">

    import { supabase }
        from "../js/supabase-config.js";


    const ADMIN_EMAIL =
        "mjawish@gmail.com";


    const form =
        document.getElementById("adminLoginForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const togglePassword =
        document.getElementById("togglePassword");


    const loginButton =
        document.getElementById("loginButton");


    const message =
        document.getElementById("message");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    togglePassword.addEventListener(
        "click",
        () => {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type = "text";

                togglePassword.textContent =
                    "Hide";

            } else {

                passwordInput.type = "password";

                togglePassword.textContent =
                    "Show";

            }

        }
    );


    /*
     * Check whether an admin is already
     * authenticated.
     */

    const {
        data: {
            session
        }
    } = await supabase.auth.getSession();


    if (session?.user) {

        if (
            session.user.email?.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
        ) {

            window.location.href =
                "admin.html";

        } else {

            await supabase.auth.signOut();

        }

    }


    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            message.textContent = "";

            message.className =
                "message";


            /*
             * Check admin email before
             * attempting authentication.
             */

            if (
                email !==
                ADMIN_EMAIL.toLowerCase()
            ) {

                showMessage(
                    "This account is not authorized to access the administration portal.",
                    "error"
                );

                return;

            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Signing In...";


            try {

                const {
                    data,
                    error
                } =
                    await supabase.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {
                    throw error;
                }


                if (
                    !data.user ||
                    data.user.email?.toLowerCase() !==
                    ADMIN_EMAIL.toLowerCase()
                ) {

                    await supabase.auth.signOut();

                    throw new Error(
                        "This account is not authorized to access the administration portal."
                    );

                }


                showMessage(
                    "Administrator authentication successful. Opening dashboard...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "admin.html";

                    },
                    500
                );


            } catch (error) {

                console.error(
                    "Admin login error:",
                    error
                );


                showMessage(
                    error.message?.includes(
                        "Invalid login credentials"
                    )
                        ? "Incorrect administrator email or password."
                        : (
                            error.message ||
                            "Unable to sign in."
                        ),
                    "error"
                );


                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

            }

        }
    );

</script>

</body>

</html>
