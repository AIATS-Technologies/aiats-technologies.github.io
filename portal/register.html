<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create AIATS Account</title>

<meta
    name="description"
    content="Create your AIATS client account."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/aiats.css">
</head>

<body>

<main class="page">


<div class="brand">
    <div class="brand-mark">A</div>
    <span>AIATS</span>
</div>

<section class="card">

    <div class="eyebrow">
        Client Registration
    </div>

    <h1>Create your account</h1>

    <p class="intro">
        Register your AIATS client account. Your portfolio
        connection and trading configuration can be completed
        after your account is activated.
    </p>

    <form id="registerForm">

        <div class="field">
            <label for="fullName">Full Name</label>

            <input
                id="fullName"
                type="text"
                autocomplete="name"
                required
                maxlength="120"
            >
        </div>

        <div class="field">
            <label for="email">Email Address</label>

            <input
                id="email"
                type="email"
                autocomplete="email"
                required
                maxlength="160"
            >
        </div>

        <div class="field">
            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <div class="password-note">
                Minimum 8 characters.
            </div>
        </div>

        <div class="field">
            <label for="accountType">Account Type</label>

            <select id="accountType" required>

                <option value="" selected disabled>
                    Select account type
                </option>

                <option value="portfolio_manager">
                    Portfolio Manager
                </option>

                <option value="portfolio_agent">
                    Portfolio Agent
                </option>

                <option value="individual">
                    Individual Portfolio
                </option>

                <option value="b2b_company">
                    B2B Company
                </option>

                <option value="b2b_fund">
                    B2B Fund
                </option>

            </select>
        </div>

        <button
            id="registerButton"
            type="submit"
        >
            Create Account
        </button>

    </form>

    <div
        id="message"
        class="message"
        role="alert"
    ></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Sign in</a>
    </div>

    <div class="back">
        <a href="index.html">
            ← Back to AIATS Portal
        </a>
    </div>

</section>

</main>

<script type="module">

    import { supabase }
        from "./js/supabase-config.js";

    const form =
        document.getElementById("registerForm");

    const button =
        document.getElementById("registerButton");

    const message =
        document.getElementById("message");

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;
    }

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        button.disabled = true;
        button.textContent = "Creating account...";

        message.className = "message";
        message.textContent = "";

        const fullName =
            document.getElementById("fullName")
                .value
                .trim();

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;

        const accountType =
            document.getElementById("accountType")
                .value;

        try {

            const {
                data,
                error
            } = await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    /*
                     * After email confirmation,
                     * Supabase returns the user here.
                     */
                    emailRedirectTo:
                        "https://aiats-technologies.github.io/portal/verified.html",

                    data: {
                        full_name: fullName,
                        account_type: accountType
                    }
                }
            });

            if (error) {
                throw error;
            }

            if (
                data.user &&
                !data.session
            ) {

                showMessage(
                    "Account created. Please check your email to verify your account.",
                    "success"
                );

                form.reset();

            } else {

                showMessage(
                    "Account created successfully.",
                    "success"
                );

            }

        } catch (error) {

            console.error(
                "Registration error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to create your account.",
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Create Account";

        }

    });

</script>

</body>
</html>
