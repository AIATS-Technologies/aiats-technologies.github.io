<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create AIATS Account</title>

<meta
    name="description"
    content="Create your AIATS client account."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", Arial, sans-serif;
        background:
            radial-gradient(
                circle at 20% 10%,
                rgba(44, 75, 120, 0.24),
                transparent 35%
            ),
            #07111f;
        color: #ffffff;
        padding: 24px;
    }

    .page {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding: 42px 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 42px;
        font-weight: 700;
        letter-spacing: 0.08em;
    }

    .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 10px;
    }

    .card {
        background: rgba(10, 24, 40, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        padding: 42px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    }

    .eyebrow {
        color: #8fa9c5;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
    }

    h1 {
        margin: 12px 0 10px;
        font-size: 34px;
        letter-spacing: -0.035em;
    }

    .intro {
        margin: 0 0 30px;
        color: #8fa0b2;
        line-height: 1.65;
        font-size: 14px;
    }

    .field {
        margin-bottom: 19px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #c7d2df;
        font-size: 12px;
        font-weight: 600;
    }

    input,
    select {
        width: 100%;
        height: 48px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        background: rgba(255,255,255,0.045);
        color: #ffffff;
        padding: 0 14px;
        font: inherit;
        outline: none;
    }

    select option {
        background: #0b1a2b;
        color: #ffffff;
    }

    input:focus,
    select:focus {
        border-color: rgba(255,255,255,0.35);
    }

    .password-note {
        margin-top: 7px;
        color: #617287;
        font-size: 11px;
    }

    button {
        width: 100%;
        height: 50px;
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: #ffffff;
        color: #07111f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin: 20px 0 0;
        padding: 13px 14px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.55;
    }

    .message.error {
        display: block;
        color: #efb0b0;
        background: rgba(150, 45, 45, 0.12);
        border: 1px solid rgba(200, 90, 90, 0.18);
    }

    .message.success {
        display: block;
        color: #b4d9bd;
        background: rgba(45, 120, 70, 0.12);
        border: 1px solid rgba(90, 170, 110, 0.18);
    }

    .login-link {
        margin-top: 24px;
        text-align: center;
        color: #718399;
        font-size: 12px;
    }

    .login-link a {
        color: #ffffff;
        text-decoration: none;
    }

    .back {
        margin-top: 24px;
        text-align: center;
    }

    .back a {
        color: #607186;
        font-size: 11px;
        text-decoration: none;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        .page {
            padding: 22px 0;
        }

        .card {
            padding: 28px 22px;
            border-radius: 17px;
        }

        h1 {
            font-size: 29px;
        }
    }
</style>

</head>

<body>

<main class="page">


<div class="brand">
    <div class="brand-mark">A</div>
    <span>AIATS</span>
</div>

<section class="card">

    <div class="eyebrow">
        Client Registration
    </div>

    <h1>Create your account</h1>

    <p class="intro">
        Register your AIATS client account. Your portfolio
        connection and trading configuration can be completed
        after your account is activated.
    </p>

    <form id="registerForm">

        <div class="field">
            <label for="fullName">Full Name</label>

            <input
                id="fullName"
                type="text"
                autocomplete="name"
                required
                maxlength="120"
            >
        </div>

        <div class="field">
            <label for="email">Email Address</label>

            <input
                id="email"
                type="email"
                autocomplete="email"
                required
                maxlength="160"
            >
        </div>

        <div class="field">
            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <div class="password-note">
                Minimum 8 characters.
            </div>
        </div>

        <div class="field">
            <label for="accountType">Account Type</label>

            <select id="accountType" required>

                <option value="" selected disabled>
                    Select account type
                </option>

                <option value="portfolio_manager">
                    Portfolio Manager
                </option>

                <option value="portfolio_agent">
                    Portfolio Agent
                </option>

                <option value="individual">
                    Individual Portfolio
                </option>

                <option value="b2b_company">
                    B2B Company
                </option>

                <option value="b2b_fund">
                    B2B Fund
                </option>

            </select>
        </div>

        <button
            id="registerButton"
            type="submit"
        >
            Create Account
        </button>

    </form>

    <div
        id="message"
        class="message"
        role="alert"
    ></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Sign in</a>
    </div>

    <div class="back">
        <a href="index.html">
            ← Back to AIATS Portal
        </a>
    </div>

</section>

</main>

<script type="module">

    import { supabase }
        from "./js/supabase-config.js";

    const form =
        document.getElementById("registerForm");

    const button =
        document.getElementById("registerButton");

    const message =
        document.getElementById("message");

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;
    }

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        button.disabled = true;
        button.textContent = "Creating account...";

        message.className = "message";
        message.textContent = "";

        const fullName =
            document.getElementById("fullName")
                .value
                .trim();

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;

        const accountType =
            document.getElementById("accountType")
                .value;

        try {

            const {
                data,
                error
            } = await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    /*
                     * After email confirmation,
                     * Supabase returns the user here.
                     */
                    emailRedirectTo:
                        "https://aiats-technologies.github.io/portal/verified.html",

                    data: {
                        full_name: fullName,
                        account_type: accountType
                    }
                }
            });

            if (error) {
                throw error;
            }

            if (
                data.user &&
                !data.session
            ) {

                showMessage(
                    "Account created. Please check your email to verify your account.",
                    "success"
                );

                form.reset();

            } else {

                showMessage(
                    "Account created successfully.",
                    "success"
                );

            }

        } catch (error) {

            console.error(
                "Registration error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to create your account.",
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Create Account";

        }

    });

</script>

</body>
</html>
